<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PharmaOnline — Your Trusted Online Pharmacy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Order medicines online with ease. Fast delivery, authentic products, and expert care.">
  <meta name="theme-color" content="#f8fafc">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f8fafc; }
    #loading-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #0f172a;
      font-family: sans-serif;
      z-index: 9999;
    }
    #loading-indicator .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(2,6,23,0.10);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    app-root:not(:empty) ~ #loading-indicator { display: none; }
  </style>
</head>
<body>
  <app-root></app-root>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <p>Loading PharmaOnline...</p>
  </div>
</body>
</html>
